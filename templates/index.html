<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Image Viewer</title>
		<link rel="stylesheet" href="/static/css/style.css" />
	</head>
	<body>
		<div class="app-shell">
			<header class="app-header">
				<div class="brand">Image Viewer IUH</div>
    <div class="header-actions" style="display: flex; gap: 12px; align-items: center;">
        <label class="upload-button" for="mediaInput">
            Upload file
            <input id="mediaInput" type="file" accept="image/*" />
        </label>
        
        <!-- NÚT SAVE (LƯU PHIÊN VÀO SERVER LOCAL) -->
        <button id="saveButton" class="upload-button save-btn" title="Lưu phiên làm việc vào máy chủ">Save</button>

        <!-- NÚT HISTORY (XEM CÁC PHIÊN ĐÃ LƯU) -->
        <button id="historyButton" class="upload-button history-btn" title="Xem danh sách phiên đã lưu">History</button>

        <!-- KHU VỰC EXPORT (CHỌN ĐỊNH DẠNG TẢI VỀ) -->
        <div class="export-controls" style="display: flex; gap: 8px; height: 52px;">
            <select id="exportFormat" class="export-select">
                <option value="jpg">JPG</option>
                <option value="png">PNG</option>
            </select>
            <button id="exportButton" class="upload-button export-btn">Export</button>
        </div>
    </div>
				
			</header>

			<main class="viewer-panel">
				<div class="comparison-grid">
					<section class="preview-card">
						<div class="card-header">
							<span>Before</span>
						</div>
						<div id="beforePreview" class="media-stage empty">Upload an image or video</div>
					</section>

					<section class="preview-card">
						<div class="card-header">
							<span>After</span>
						</div>
						<div id="afterPreview" class="media-stage empty">Preview after changes</div>
					</section>
				</div>

				<div class="tool-panel">
					<div class="control-card">
						<div class="control-header">
							<span>Zoom</span>
							<span id="zoomValue" class="slider-value">100%</span>
						</div>
						<input id="zoomSlider" type="range" min="50" max="200" value="100" step="5" />
					</div>

					<div class="control-card">
						<div class="control-header">
							<span>Rotate</span>
							<span id="rotateValue" class="slider-value">0°</span>
						</div>
						<input id="rotateSlider" type="range" min="-180" max="180" value="0" step="5" />
					</div>

					<div class="control-card">
						<div class="control-header">
							<span>Crop</span>
							<span id="cropValue" class="slider-value">0%</span>
						</div>
						<input id="cropSlider" type="range" min="0" max="30" value="0" step="1" />
					</div>
				</div>
			</main>
		</div>

		<!-- MODAL DANH SÁCH PHIÊN LÀM VIỆC ĐÃ LƯU -->
		<div id="sessionsModal" class="modal-backdrop">
			<div class="modal-dialog">
				<div class="modal-header">
					<div class="modal-title">
						<span>📁 Saved Sessions</span>
						<span id="sessionCountBadge" class="count-badge">0</span>
					</div>
					<button id="closeModalBtn" class="modal-close-btn" title="Đóng">&times;</button>
				</div>
				<div class="modal-body">
					<div id="sessionsList" class="sessions-list">
						<!-- Danh sách các phiên làm việc được render động -->
					</div>
				</div>
			</div>
		</div>

		<!-- TOAST THÔNG BÁO NHANH -->
		<div id="toastNotification" class="toast-notification"></div>

		<script src="/static/js/script.js"></script>
	</body>
</html>
